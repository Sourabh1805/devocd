name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          # The eval suite's pinned commit (evals/_fixture/PIN) must be reachable.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test "tests/unit/**/*.test.mjs"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.319
      - name: Validate plugin
        run: node scripts/validate-plugin.mjs
